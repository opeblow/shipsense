databases:
  - name: shipsense-postgres
    databaseName: shipsense
    user: shipsense
    plan: free

services:
  - type: web
    name: shipsense-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn shipsense.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: shipsense-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
